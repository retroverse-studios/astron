name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the desktop app is a Tauri build (Rust + webkit) — release workflow's job
      - run: pnpm -r --filter '!astron-desktop' build
      # package builds already ran tsc; the web app's vite build does not typecheck
      - run: pnpm --filter @astron/web typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r test
